name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # src-tauri links GTK/WebKit through Tauri, so it will not build on a bare Linux
      # runner — glib-sys fails at pkg-config before any test runs.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Type check. Fails on warnings too.
      - run: bun run check

      - run: bun run lint

      - run: bun run format:check

      - run: bun run test

      # tauri::generate_context! needs frontendDist (../build) to exist.
      - run: bun run build

      - run: cargo test --manifest-path src-tauri/Cargo.toml
